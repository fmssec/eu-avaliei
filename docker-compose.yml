services:
  web:
    build: .
    image: eu-avaliei:local
    ports:
      - "3000:3000"

    # A configuração vive em .env.local, o mesmo arquivo que o `npm run dev`
    # usa. Ele está no .gitignore e no .dockerignore: as chaves nunca são
    # versionadas nem embutidas na imagem, e são lidas do host ao subir.
    env_file:
      - path: .env.local
        required: false

    # Sem volume: nada no produto precisa sobreviver ao container. O card
    # existe enquanto está sendo feito e vira a imagem que a pessoa leva; as
    # artes enviadas são cache de sessão em /tmp. É isso que permite hospedar
    # de graça, em qualquer lugar que rode um container.
    tmpfs:
      - /tmp

    # Sem política de restart, de propósito: `unless-stopped` e `always` fazem
    # o daemon subir o container sozinho toda vez que o Docker Desktop abre.
    # Aqui o start é sempre manual — `docker compose up`.
    # Em servidor, use docker-compose.prod.yml, que reativa o restart.
    restart: "no"

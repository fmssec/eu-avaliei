services:
  web:
    build: .
    image: eu-avaliei:local
    ports:
      - "3000:3000"

    # A configuração vive em .env.local, o mesmo arquivo que o `npm run dev`
    # usa — uma fonte só para os dois modos. Ele está no .gitignore e no
    # .dockerignore: o token nunca é versionado nem embutido na imagem, e é
    # lido do host na hora de subir o container.
    #
    # `required: false` para o projeto continuar subindo sem o arquivo, no
    # provider mock, que é o caminho de quem só quer ver funcionando.
    env_file:
      - path: .env.local
        required: false

    volumes:
      # Cards e artes enviadas sobrevivem ao recriar o container.
      - card-data:/app/.data

    # Sem política de restart, de propósito: `unless-stopped` e `always` fazem
    # o daemon subir o container sozinho toda vez que o Docker Desktop abre.
    # Aqui o start é sempre manual — `docker compose up`.
    restart: "no"

volumes:
  card-data:
